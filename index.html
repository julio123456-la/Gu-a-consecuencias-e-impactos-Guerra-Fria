<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Juegos Escolares</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            text-align: center; 
            padding: 50px 20px; 
            margin: 0;
        }
        h1 { color: #00ff88; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 1.1rem; margin-bottom: 40px; }
        .grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn { 
            background: #1e1e1e; 
            color: #00ff88; 
            border: 2px solid #00ff88; 
            padding: 15px 30px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            border-radius: 8px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.1);
        }
        .btn:hover { 
            background: #00ff88; 
            color: #121212;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.3);
        }
    </style>
</head>
<body>

    <h1>Portal de Juegos Desbloqueados</h1>
    <p>Selecciona un juego para abrirlo de forma segura en una pestaña oculta (about:blank):</p>
    
    <div class="grid">
        <!-- BOTÓN DE EAGLERCRAFT -->
        <button class="btn" onclick="abrirJuego('https://svaaps.github.io/eaglercrafthtml/')">
            🎮 Jugar Eaglercraft (Minecraft 1.8)
        </button>
    </div>

    <script>
    function abrirJuego(https://svaaps.github.io/eaglercrafthtml/) {
        // 1. Crea la pestaña en blanco
        var win = window.open();
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        win.document.body.style.backgroundColor = '#000';
        
        // 2. Genera el contenedor iframe a pantalla completa
        var iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.margin = '0';
        iframe.style.padding = '0';
        
        // 3. Asigna la URL del juego elegido
        iframe.src = urlDelJuego; 
        
        // 4. Introduce el iframe dentro de about:blank
        win.document.body.appendChild(iframe);
    }
    </script>

</body>
</html>
