<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom - Mis Tareas</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://gstatic.com">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background-color: #1a1a1a; }
        #portal-menu { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: white; text-align: center; }
        h1 { color: #00ff88; font-size: 2.3rem; margin-bottom: 5px; }
        p { color: #888; margin-bottom: 30px; }
        .game-btn { background: #282828; color: #00ff88; border: 2px solid #00ff88; padding: 15px 35px; font-size: 18px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.2s ease; }
        .game-btn:hover { background: #00ff88; color: #1a1a1a; transform: scale(1.05); }
    </style>
</head>
<body>

    <!-- MENÚ DEL PORTAL -->
    <div id="portal-menu">
        <h1>Portal de Juegos Desbloqueados</h1>
        <p>Alojado de forma segura en tu repositorio de GitHub.</p>
        <button class="game-btn" onclick="iniciarMinecraftOculto()">🎮 Jugar Eaglercraft (Modo Invisible)</button>
    </div>

    <script>
        function iniciarMinecraftOculto() {
            // 1. Creamos una ventana completamente nueva en blanco
            var nuevaVentana = window.open("about:blank", "_blank");
            
            if (!nuevaVentana) {
                alert("Por favor, permite los pop-ups (ventanas emergentes) en esta página para que el juego pueda abrirse de forma oculta.");
                return;
            }

            // 2. Definimos el servidor alternativo sin extensión .io (Usamos una réplica estable .org)
            var enlaceJuego = "https://eaglercraft.org"; 

            // 3. Escribimos el documento HTML directamente dentro de la pestaña about:blank
            // De esta forma, Securly solo ve que la pestaña es "about:blank" y no detecta el juego.
            nuevaVentana.document.write(`
                <!DOCTYPE html>
                <html lang="es">
                <head>
                    <meta charset="UTF-8">
                    <title>Google Docs - Documento sin título</title>
                    <link rel="icon" type="image/x-icon" href="https://gstatic.com">
                    <style>
                        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
                        iframe { width: 100%; height: 100%; border: none; }
                    </style>
                </head>
                <body>
                    <iframe src="${enlaceJuego}" allow="fullscreen; autoplay"></iframe>
                </body>
                </html>
            `);
            
            nuevaVentana.document.close();
        }
    </script>
</body>
</html>
