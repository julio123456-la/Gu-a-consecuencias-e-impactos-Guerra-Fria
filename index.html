<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Juegos Escolares</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; text-align: center; padding: 50px; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <h1>Portal de Juegos</h1>
    <p>Haz clic abajo para abrir el juego en una pestaña protegida:</p>
    
    <!-- Botón para abrir el juego -->
    <button class="btn" onclick="abrirJuego()">Abrir Eaglercraft</button>

    <script>
    function abrirJuego() {
        var win = window.open();
        win.document.body.style.margin = '0';
        win.document.body.style.height = '100vh';
        
        var iframe = win.document.createElement('iframe');
        iframe.style.border = 'none';
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.margin = '0';
        
        // REEMPLAZA EL LINK DE ABAJO por el enlace directo al juego que quieras cargar
        iframe.src = "https://github.io"; 
        
        win.document.body.appendChild(iframe);
    }
    </script>

</body>
</html>
